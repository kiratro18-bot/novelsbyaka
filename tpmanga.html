<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manga Library</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
    <h1 class="wordmark" id="wordmark">Manga<span>.</span></h1>
    <p class="tagline">Read one-handed, anywhere</p>
  </div>
</header>

<main class="wrap">
  <div id="continueSlot"></div>

  <div class="section-label">Library <small id="countLabel"></small></div>
  <div class="grid" id="grid"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <h3>No chapters yet</h3>
    <p>Drop page images into a folder under <code>chapters/</code>, then run<br><code>python3 generate_manifest.py</code> to add them here.</p>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>

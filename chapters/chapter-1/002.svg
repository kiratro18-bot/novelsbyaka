<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots2" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.8" fill="#16151a"/>
    </pattern>
  </defs>
  <rect width="800" height="1200" fill="#f4f2ec"/>
  <!-- Panel A: wide top -->
  <g>
    <rect x="24" y="24" width="752" height="380" fill="#fff" stroke="#16151a" stroke-width="6"/>
    <g stroke="#16151a" stroke-width="1.6" opacity="0.5">
      <line x1="400" y1="214" x2="60" y2="60"/>
      <line x1="400" y1="214" x2="740" y2="60"/>
      <line x1="400" y1="214" x2="40" y2="214"/>
      <line x1="400" y1="214" x2="760" y2="214"/>
      <line x1="400" y1="214" x2="60" y2="370"/>
      <line x1="400" y1="214" x2="740" y2="370"/>
    </g>
    <circle cx="400" cy="214" r="70" fill="#16151a"/>
    <text x="130" y="130" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#16151a" transform="rotate(-8 130 130)">DOSU!</text>
  </g>
  <!-- Panel B: bottom-left -->
  <g>
    <rect x="24" y="420" width="360" height="380" fill="url(#dots2)" stroke="#16151a" stroke-width="6"/>
    <rect x="24" y="420" width="360" height="380" fill="#f4f2ec" opacity="0.15"/>
    <ellipse cx="200" cy="640" rx="110" ry="150" fill="#16151a"/>

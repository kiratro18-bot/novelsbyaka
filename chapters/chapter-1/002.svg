  </g>
  <!-- Panel C: bottom-right -->
  <g>
    <rect x="400" y="420" width="376" height="380" fill="#fff" stroke="#16151a" stroke-width="6"/>
    <path d="M420 780 L560 460 L700 780 Z" fill="#16151a"/>
    <text x="588" y="470" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#16151a">!?</text>
  </g>
  <!-- Panel D: bottom strip -->
  <g>
    <rect x="24" y="816" width="752" height="360" fill="#fff" stroke="#16151a" stroke-width="6"/>
    <rect x="24" y="1000" width="752" height="176" fill="url(#dots2)" opacity="0.5"/>
    <g transform="translate(400,940)">
      <rect x="-180" y="-60" width="360" height="120" fill="#16151a"/>
